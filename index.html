<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQX 専門家・ガチ勢向けマスター診断（全部入り）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-sub: #7a7a7a;
            --border-main: #2b2b2b;
            --bruna-red: #d93829;
            --bruna-blue: #266093;
            --bruna-yellow: #f2b93b;
            --bruna-green: #438b43;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            letter-spacing: 0.03em;
            line-height: 1.4;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-main);
            border-radius: 12px;
            padding: 16px 14px;
            box-shadow: 4px 4px 0px var(--border-main);
            margin-bottom: 10px;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        .hero-title {
            font-size: 1.1rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .hero-subtitle {
            font-size: 0.72rem;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .mode-select-label {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--text-main);
            text-align: center;
        }

        /* 2列グリッドでスクロール不要に */
        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-bottom: 4px;
        }

        .btn-mode {
            background: #fff;
            border: 2px solid var(--border-main);
            border-radius: 6px;
            padding: 6px 8px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 2px 2px 0px var(--border-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-mode:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 0px var(--border-main);
            background: #fdfbf7;
        }

        .btn-mode b {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 1px;
            line-height: 1.2;
        }

        .btn-mode small {
            color: var(--text-sub);
            font-size: 0.62rem;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .progress-container {
            height: 8px;
            background: #e0e0e0;
            border: 2px solid var(--border-main);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 100%;
            background: var(--bruna-red);
            width: 0%;
            transition: width 0.3s ease;
        }

        .q-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 14px;
            text-align: left;
            line-height: 1.4;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .choice-btn {
            background: #fff;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.1s ease;
            box-shadow: 2px 2px 0px var(--border-main);
        }

        .choice-btn:hover {
            background: #fdfbf7;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #fff;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .result-label {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: var(--bruna-red);
            font-weight: bold;
            text-align: center;
        }

        .result-percent {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            margin: 4px 0;
            color: var(--text-main);
        }

        .result-percent span {
            font-size: 1.1rem;
        }

        .result-rank {
            text-align: center;
            font-size: 0.82rem;
            font-weight: bold;
            background: #f4efe6;
            border: 2px solid var(--border-main);
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .score-box {
            margin-bottom: 12px;
        }

        .score-row {
            display: grid;
            grid-template-columns: 80px 1fr 35px;
            gap: 6px;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .score-track {
            height: 6px;
            background: #eee;
            border: 1px solid var(--border-main);
            border-radius: 99px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: var(--bruna-blue);
        }

        .insight-box {
            background: #fffdf5;
            border: 2px dashed var(--bruna-yellow);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 0.78rem;
        }

        .insight-box h4 {
            color: #b58106;
            margin-bottom: 4px;
            font-size: 0.82rem;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-primary {
            background: var(--bruna-red);
            color: #fff;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-main);
            transition: transform 0.1s;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .footer-note {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-align: center;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
        <div class="card">
            <h1 class="hero-title">🐰 DQX ガチ勢マスター診断（全部入り）</h1>
            <p class="hero-subtitle">バトル・エンドコンテンツからストーリーまで完全網羅（全12ジャンル・10問）</p>
            
            <div class="mode-select-label">▼ 挑戦したいマニアックジャンルを選んでね</div>
            <div class="mode-buttons">
                <!-- 既存6ジャンル -->
                <button class="btn-mode" onclick="startQuiz('hiroba')">
                    <b>📸 広場・写真コンテスト</b>
                    <small>サムネ解像度・ライティング</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('micolle')">
                    <b>👗 マイコレ・ドレア</b>
                    <small>骨格補正・ツヤめきペレット</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('housing')">
                    <b>🏠 ハウコン（ハウジング）</b>
                    <small>座標ずらし・クリップ回避</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('ascon')">
                    <b>👑 アスコン（撮影技術）</b>
                    <small>しぐさキャンセル・環境光</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('fishing')">
                    <b>🎣 フィッシング</b>
                    <small>暴れモーション・魚影選別</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('minigame')">
                    <b>⭐ トラシュカ（ミニゲーム）</b>
                    <small>ベクトル予測・判定ボックス</small>
                </button>
                <!-- 新規追加6ジャンル -->
                <button class="btn-mode" onclick="startQuiz('seisugosha')">
                    <b>🛡️ 聖守護者・常闇</b>
                    <small>AIカウント・タゲ下がり</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('boueigun')">
                    <b>🏰 アストルティア防衛軍</b>
                    <small>ツッコミ移動・FB耐性</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('jashin')">
                    <b>⚔️ 邪神の宮殿（天獄）</b>
                    <small>天獄条件・災禍の陣・高速討伐</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('story')">
                    <b>📖 ストーリー・世界観</b>
                    <small>魔界言語・神話時代・裏設定</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('slime')">
                    <b>🟢 隠れスライムフェス</b>
                    <small>出現アルゴリズム・死角探索</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('casino')">
                    <b>🎰 カジノ・ミニゲーム</b>
                    <small>ダブルアップ・期待値計算</small>
                </button>
            </div>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
        <div class="card">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="quiz-header">
                <span id="q-num">Q1 / 10</span>
                <span id="q-cat" style="color: var(--bruna-blue);">カテゴリ</span>
            </div>
            <h2 id="q-title" class="q-title">質問文がここに入ります</h2>
            <div id="choices-area" class="choices"></div>
            <button class="btn-secondary" onclick="prevQuestion()" id="btn-prev">最初に戻る</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div class="card" id="result-card">
            <div class="result-label" id="res-mode-label">DIAGNOSIS RESULT</div>
            <div class="result-percent" id="res-percent">82<span>%</span></div>
            <div class="result-rank" id="res-rank">S ｜ 熟練のガチ勢・トップランカーレベル！</div>

            <div class="score-box" id="score-breakdown"></div>

            <div class="insight-box">
                <h4>💡 プロの赤ペン先生＆マニアック解説</h4>
                <p id="res-advice">ここにアドバイスが入ります。</p>
            </div>
        </div>

        <div class="action-group">
            <button class="btn-primary" onclick="downloadResultImage()">📷 結果を画像で保存・シェアする</button>
            <button class="btn-secondary" onclick="restart()">ジャンル選定に戻る</button>
        </div>
        <div class="footer-note">※DQXの仕様やコンテスト、エンドコンテンツの傾向を極限まで深掘りした学習用シミュレーターです。</div>
    </div>

</div>

<script>
// ==========================================
// ガチ勢向け専門データ（全12ジャンル・各10問）
// ==========================================
const QUESTION_DATA = {
    hiroba: {
        name: "広場・写真コンテスト",
        questions: [
            { cat: "サムネ圧縮", text: "「みんなのお知らせ広場」の一覧（極小サムネイル状態）で、審査員や他の人のスクロールの手を止めさせるために最も不可欠な要素は？", choices: [
                ["キャラクターが着ている最新装備のブランドアピール", 1],
                ["主役の輪郭が周囲の背景に溶け込まない『明度差・コントラストの確保』", 3],
                ["写真全体にエフェクトを盛って華やかにすること", 0]
            ]},
            { cat: "視線誘導", text: "被写界深度（ピント）と視線誘導のテクニックとして、画面の「3分割法」や交点に配置する際の注意点は？", choices: [

                ["画面いっぱいに情報を敷き詰めて密度を上げる", 0],

            { cat: "エフェクト", text: "カメラ機能の「エフェクト（集中線やキラキラなど）」を使う際、プロが避けるべき致命的な罠は？", choices: [

                ["エフェクトを全く使わずに地味な絵面になってしまうこと", 1]

            { cat: "タイトル", text: "写真のタイトル・一言コメントで、上位入賞常連者がよく使う心理的テクニックは？", choices: [

                ["写真単体ではあえて語らず、タイトルで『一筋のストーリーや余白』を補完する", 3],

            { cat: "環境光", text: "屋外フィールドで撮影する際、キャラクターの顔に不自然な影（死角の黒ずみ）をつからないための技術は？", choices: [
                ["太陽の高度や方位（朝・昼・夕方）を計算し、カメラアングルと光源の角度を一致させる", 3],
                ["とりあえず「おきあがる」等のしぐさで強制的に光源をリセットする", 1],
                ["夜間にしてランタンや照明家具の光だけに頼る", 0]
            ]},
            { cat: "背景分離", text: "背景がごちゃついた場所で主役を際立たせるため、DQXのカメラ仕様において有効な手段は？", choices: [
                ["キャラクターの服の色を背景と同系色にして馴染ませる", 0],
                ["スタンプやフレームで周囲を完全に隠す", 1],

            { cat: "構図意図", text: "「あえて画面の端に小さくキャラクターを配置する（日の丸構図の崩し）」が評価される理由は？", choices: [
                ["キャラクターの顔のアップよりも体全体が見えるから", 1],
                ["広大な世界観や孤独感、ドラマチックな『空気感』を演出できるから", 3],

            { cat: "動機同期", text: "グループ・フレンド写真を撮影する際、複数人の「目線やモーションの同期」で最も気をつけるべき点は？", choices: [

                ["全員が同じ服を着てペアルック感を出すこと", 0]

            { cat: "トレンド", text: "広場のコンテストで「過去に入賞した作品の類似表現」が選ばれにくくなる原因は？", choices: [

// ==========================================
// 状態管理・エンジン
// ==========================================
let currentMode = 'hiroba';
let currentIndex = 0;
let userAnswers = [];

function startQuiz(mode) {
    currentMode = mode;
    currentIndex = 0;
    userAnswers = [];
    renderQuestion();
    showScreen('screen-quiz');
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
    const qList = QUESTION_DATA[currentMode].questions;
    const q = qList[currentIndex];

    const progressPercent = (currentIndex / qList.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;

    document.getElementById('q-num').textContent = `Q${currentIndex + 1} / ${qList.length}`;
    document.getElementById('q-cat').textContent = q.cat;
    document.getElementById('q-title').textContent = q.text;

    const choicesArea = document.getElementById('choices-area');
    choicesArea.innerHTML = '';

    q.choices.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        const keyLetters = ['A', 'B', 'C'];
        btn.innerHTML = `<b>${keyLetters[idx]}：${choice[0]}</b>`;
        btn.onclick = () => selectAnswer(choice[1]);
        choicesArea.appendChild(btn);
    });

    const prevBtn = document.getElementById('btn-prev');
    if (currentIndex === 0) {
        prevBtn.textContent = "ジャンル選定に戻る";
        prevBtn.onclick = () => showScreen('screen-start');
    } else {
        prevBtn.textContent = "一つ戻る";
        prevBtn.onclick = () => prevQuestion();
    }
}

function selectAnswer(score) {
    userAnswers[currentIndex] = score;
    const qList = QUESTION_DATA[currentMode].questions;
    
    if (currentIndex < qList.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        calculateResult();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function calculateResult() {
    const totalScore = userAnswers.reduce((a, b) => a + b, 0);
    const maxScore = QUESTION_DATA[currentMode].questions.length * 3;
    
    let percentage = Math.round((totalScore / maxScore) * 75 + 20);
    percentage = Math.min(98, Math.max(15, percentage));

    const modeName = QUESTION_DATA[currentMode].name;
    document.getElementById('res-mode-label').textContent = modeName.toUpperCase();

    let rankText = "";
    if (percentage >= 88) rankText = `S ｜ 熟練のガチ勢・トップランカー極みレベル！`;
    else if (percentage >= 72) rankText = `A ｜ コンテスト上位・高得点を確実に狙える実力者！`;
    else if (percentage >= 50) rankText = `B ｜ 知識の引き出しは豊富！細部の詰めが勝利の鍵`;
    else rankText = `C ｜ 伸びしろの塊！マニアックな専門視点を吸収して大躍進しよう`;

    document.getElementById('res-percent').innerHTML = `${percentage}<span>%</span>`;
    document.getElementById('res-rank').textContent = rankText;

    const breakdownArea = document.getElementById('score-breakdown');
    breakdownArea.innerHTML = `
        <div class="score-row"><span>専門知識</span><div class="score-track"><div class="score-fill" style="width: ${Math.min(100, percentage + 5)}%;"></div></div><span>${Math.min(100, percentage + 5)}%</span></div>
        <div class="score-row"><span>実戦テク</span><div class="score-track"><div class="score-fill" style="width: ${percentage}%;"></div></div><span>${percentage}%</span></div>
        <div class="score-row"><span>判断・分析力</span><div class="score-track"><div class="score-fill" style="width: ${Math.max(35, percentage - 10)}%;"></div></div><span>${Math.max(35, percentage - 10)}%</span></div>
    `;

    let adviceText = "";
    if (percentage >= 88) {
        adviceText = `【Sランク・赤ペン先生】お見事です！正解の位置がランダムに散らばる中、一切惑わされずにこのスコアを叩き出すのは本物のトップランカー証拠。仕様の裏側やフレーム単位の調整まで完璧に体に染み込んでいますね。ぜひその知識を周りにも広げてください！`;
    } else if (percentage >= 72) {
        adviceText = `【Aランク・赤ペン先生】素晴らしい正答率です！コンテストの審査基準や実戦的なテクニックの要所をしっかりと抑えています。あと一歩で満点圏内なので、惜しかった問題の「仕様の意図」を振り返ってみるとさらに視野が広がりますよ！`;
    } else if (percentage >= 50) {
        adviceText = `【Bランク・赤ペン先生】なかなかの健闘です！基本的な知識やトレンドへのアンテナは張られています。ただ、細部の当たり判定やカメラのクリップ回避、フレーム単位の調整といった「一歩上のマニアックな視点」を取り入れると、さらに上のランクへいけます！`;
    } else {
        adviceText = `【Cランク・赤ペン先生】お疲れ様でした！今回は位置のランダム性もあり、かなり歯ごたえのある内容だったはずです。ここで出てきた専門用語やテクニックはどれもガチ勢の常識的な引き出しなので、今回の解説をヒントにぜひリベンジしてみてください！`;
    }
    
    document.getElementById('res-advice').textContent = adviceText;

    showScreen('screen-result');
}

function restart() {
    currentIndex = 0;
    userAnswers = [];
    showScreen('screen-start');
}

function downloadResultImage() {
    const targetCard = document.getElementById('result-card');
    
    html2canvas(targetCard, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'dqx-maniax-diagnosis-result.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
