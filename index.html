<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DQ10 ハウジング100選・選抜率診断｜本格版</title>
<style>
:root{--bg:#0e0f11;--panel:#17181c;--panel2:#202228;--text:#f4f1ea;--muted:#9699a2;--line:#33363e;--gold:#d7c38e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#303138 0,#0e0f11 50%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 17px 60px}.hero{text-align:center;padding:28px 8px 22px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold)}h1{font:400 clamp(30px,7vw,52px)/1.1 Georgia,serif;letter-spacing:.03em;margin:15px 0}.lead{color:#b8bac0;line-height:1.8;font-size:14px}.card{background:#17181ceF;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:15px;box-shadow:0 20px 60px #0006}.progress{height:3px;background:#2e3036;border-radius:99px;overflow:hidden;margin-bottom:24px}.bar{height:100%;background:var(--gold);width:0;transition:.25s}.qmeta{display:flex;justify-content:space-between;color:var(--gold);font-size:11px;letter-spacing:.1em}.category{color:#747780}h2{font-size:21px;line-height:1.6;font-weight:500;margin:11px 0 20px}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid #3a3d45;background:var(--panel2);color:var(--text);border-radius:12px;padding:15px 15px;font:inherit;cursor:pointer;transition:.15s}.choice:hover{border-color:#747780;transform:translateY(-1px)}.choice b{display:block;font-size:14px;font-weight:500}.choice small{display:block;color:#858891;margin-top:5px}.result{text-align:center}.label{font-size:11px;letter-spacing:.2em;color:var(--gold)}.percent{font:400 clamp(70px,18vw,110px)/1 Georgia,serif;margin:12px 0 3px}.percent span{font-size:.35em}.rank{font-size:17px;margin-bottom:22px}.meter{height:8px;max-width:520px;margin:auto;background:#2c2e34;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--gold);transition:1s}.summary{margin:26px auto 0;max-width:600px;text-align:left;border-top:1px solid var(--line);padding-top:22px}.score{display:grid;grid-template-columns:85px 1fr 42px;gap:9px;align-items:center;margin:11px 0;font-size:12px}.track{height:7px;background:#303239;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:#aeb0b7}.insight{margin-top:23px;padding:18px;border:1px solid var(--line);border-radius:12px;text-align:left;line-height:1.75;font-size:13px}.insight strong{color:var(--gold);font-weight:500}.advice{margin-top:14px;color:#c8c9ce}.tag{display:inline-block;border:1px solid #4a4c54;border-radius:99px;padding:5px 10px;margin:3px;font-size:11px;color:#c9cad0}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:22px}.actions button{border-radius:99px;padding:11px 18px;font:inherit;cursor:pointer}.primary{background:var(--gold);border:1px solid var(--gold);color:#171717}.secondary{background:transparent;border:1px solid #555861;color:var(--text)}.note{font-size:10px;color:#6e727b;line-height:1.7;margin-top:22px}.hidden{display:none}footer{text-align:center;color:#5f636c;font-size:10px;margin-top:25px}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="eyebrow">DRAGON QUEST X / HOUSING</div>
<h1>100選・選抜率診断</h1>
<p class="lead">あなたのハウジングは、一次選考を突破できる作品なのか。<br>18問・6つの観点から「作品としての選抜力」を診断します。</p>
</section>

<main id="quiz" class="card">
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="qmeta"><span id="qnum"></span><span id="cat" class="category"></span></div>
<h2 id="question"></h2><div id="choices" class="choices"></div>
</main>

<main id="result" class="card result hidden">
<div class="label">YOUR 100-SELECTION POWER</div>
<div id="percent" class="percent"></div>
<div id="rank" class="rank"></div>
<div class="meter"><i id="meter"></i></div>
<div id="summary" class="summary"></div>
<div id="insight" class="insight"></div>
<div class="actions"><button class="primary" onclick="copyResult()">結果をコピー</button><button class="secondary" onclick="restart()">もう一度診断</button></div>
<div class="note">※「選抜率」は実際の当選確率ではなく、公式コンテストで示された評価観点を参考に設計した試作品の独自指標です。第5回では運営チームの一次選考を突破した100作品が投票に進み、「素晴らしい家」「写真・PR文章」が主な審査基準とされました。</div>
</main>
<footer>Prototype / DQ10 Housing 100 Selection Diagnostic</footer>
</div>

<script>
const qs=[
["テーマ","この家を一言で表すなら、明確なテーマがありますか？",[["作品名まで含めて明確",3],["テーマはかなり明確",2],["なんとなく決めている",1],["特にない",0]],"theme"],
["構成","最初に見た人の視線を誘導する「主役」がありますか？",[["主役を意図的に作っている",3],["自然と目立つ場所がある",2],["全体を見てほしい",1],["特に考えていない",0]],"composition"],
["完成度","家具・庭具は「足す」だけでなく「引く」ことも意識していますか？",[["不要なものは積極的に削る",3],["多少は整理する",2],["基本的に足していく",1],["置けるものは全部置きたい",0]],"completion"],
["独創性","他の有名ハウジングを参考にした場合、自分の作品にどう落とし込みますか？",[["発想だけ借りて別の作品にする",3],["かなり自分流に変える",2],["似た雰囲気を目指す",1],["ほぼそのまま再現する",0]],"originality"],
["写真","応募写真を撮るとしたら、どのくらい試しますか？",[["構図・距離・光を変えて大量に撮る",3],["何パターンか撮って選ぶ",2],["気に入った1枚を使う",1],["普段の記録写真を使う",0]],"photo"],
["統一性","色・素材・家具のテイストに統一感がありますか？",[["全体のルールを決めている",3],["かなり統一されている",2],["部分ごとに違う",1],["好きなものを自由に置く",0]],"completion"],
["物語","その家に入った人が「何かの物語」を想像できると思いますか？",[["明確な物語がある",3],["世界観から想像できる",2],["雰囲気はある",1],["特に考えていない",0]],"theme"],
["構成","余白を「何もない空間」ではなく、作品の一部として使っていますか？",[["かなり意識している",3],["必要な場所には作る",2],["家具を置くことを優先",1],["余白はもったいない",0]],"composition"],
["独創性","自分の家を見た人に、一番言ってほしい言葉は？",[["「こんなの初めて見た」",3],["「アイデアがすごい」",3],["「完成度が高い」",2],["「自分も作ってみたい」",2]],"originality"],
["写真","カメラアングルについて、あなたは？",[["家を一番美しく見せる位置を探す",3],["普段からかなり調整する",2],["見やすければOK",1],["ほぼ意識しない",0]],"photo"],
["完成度","近くで見たときの細部まで作り込んでいますか？",[["細部こそ作品の価値だと思う",3],["主要部分はかなり作る",2],["遠目で綺麗なら十分",1],["細部はあまり気にしない",0]],"completion"],
["テーマ","家具ひとつひとつに「なぜそこに置いたか」を説明できますか？",[["ほとんど説明できる",3],["主要家具なら説明できる",2],["見た目が良いから置くことも多い",1],["特に意味はない",0]],"theme"],
["構成","画面の中に「主役・脇役・背景」の階層がありますか？",[["明確に設計している",3],["ある程度意識している",2],["結果的にそうなっている",1],["全部同じくらい見せたい",0]],"composition"],
["写真","実物の家と応募写真、どちらをより重要だと思いますか？",[["応募写真も作品そのもの",3],["写真はかなり重要",2],["実物の方が重要",1],["写真は記録にすぎない",0]],"photo"],
["独創性","「流行しているハウジング」を見ると？",[["流行とは違う方向を試したくなる",3],["参考にしつつ自分の方向へ",2],["良いものは積極的に取り入れる",1],["流行をできるだけ取り入れる",0]],"originality"],
["完成度","完成後に一度、家具を減らして見直しますか？",[["必ず引き算する",3],["気になるところは減らす",2],["ほぼしない",1],["減らすより追加する",0]],"completion"],
["テーマ","タイトル・キャッチフレーズ・PR文はどう作りますか？",[["写真と一体の作品として考える",3],["魅力が伝わるように工夫する",2],["簡単な説明を書く",1],["ほぼ考えない",0]],"photo"],
["総合","コンテスト提出前、最後に一番確認したいのは？",[["一枚の写真として強いか",3],["家全体の完成度",3],["他にない魅力があるか",3],["自分が好きかどうか",2]],"overall"]
];

const labels={completion:"完成度",originality:"独創性",composition:"構成力",photo:"写真力",theme:"テーマ性"};
let i=0,s={completion:0,originality:0,composition:0,photo:0,theme:0},overall=0;

function render(){
 const q=qs[i]; qnum.textContent=`QUESTION ${String(i+1).padStart(2,"0")} / 18`; cat.textContent=q[0]; question.textContent=q[1]; bar.style.width=(i/18*100)+"%"; choices.innerHTML="";
 q[2].forEach((x,n)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=`<b>${["A","B","C","D"][n]}　${x[0]}</b><small>${q[3]==="overall"?"総合判定":labels[q[3]]+"に加点"}</small>`;b.onclick=()=>ans(x[1],q[3]);choices.appendChild(b)})
}
function ans(v,k){if(k==="overall")overall+=v;else s[k]+=v;i++;i<18?render():result()}
function result(){
 quiz.classList.add("hidden");resultEl=document.getElementById("result");resultEl.classList.remove("hidden");
 const total=Object.values(s).reduce((a,b)=>a+b,0)+overall;
 const max=18*3;
 // 試作品用：中間50付近、上限96。各軸のバランスもわずかに評価。
 const avg=total/max;
 const vals=Object.values(s).map(v=>v/12);
 const balance=Math.max(0,1-(Math.max(...vals)-Math.min(...vals)));
 let p=Math.round(15+avg*70+balance*8);
 p=Math.max(8,Math.min(96,p));
 percent.innerHTML=p+"<span>%</span>";meter.style.width=p+"%";
 rank.textContent=p>=85?"S｜一次選考を強く意識できるレベル":p>=72?"A｜100選を狙える有力候補":p>=58?"B｜十分可能性あり、磨けば届く":p>=42?"C｜魅力はある。見せ方が鍵":p>=25?"D｜作品としての整理から":"E｜まずは核となるテーマ作りから";
 summary.innerHTML=Object.entries(s).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{let z=Math.round(v/12*100);return `<div class="score"><span>${labels[k]}</span><div class="track"><i style="width:${z}%"></i></div><b>${z}</b></div>`}).join("");
 const sorted=Object.entries(s).sort((a,b)=>b[1]-a[1]);const strong=sorted[0][0],weak=sorted[4][0];
 const tips={
 completion:"「足した量」より、不要な要素を削った後に残る完成度を意識すると強くなります。",
 originality:"流行の技法を使っても、最後に自分だけの解釈を一つ入れると作品性が上がります。",
 composition:"主役・脇役・背景・余白を整理し、一枚の画面として成立させることが重要です。",
 photo:"実物が良くても写真で伝わらなければ不利。応募用の一枚を作品として撮り下ろしましょう。",
 theme:"テーマ、タイトル、PR文を一本につなげると、初見でも作品の意図が伝わりやすくなります。"
 };
 insight.innerHTML=`<strong>最大の武器｜${labels[strong]}</strong><div class="advice">${tips[strong]}</div><br><strong>最大の課題｜${labels[weak]}</strong><div class="advice">${tips[weak]}</div><br><span class="tag">${labels[strong]}型</span><span class="tag">${p>=72?"一次選考圏":"伸びしろ大"}</span>`;
}
function restart(){i=0;s={completion:0,originality:0,composition:0,photo:0,theme:0};overall=0;document.getElementById("result").classList.add("hidden");quiz.classList.remove("hidden");render()}
function copyResult(){let t=`DQ10 ハウジング100選・選抜率診断\\n私の100選選抜率は ${percent.innerText}\\n${rank.innerText}\\n#DQ10 #DQ10ハウジング`;navigator.clipboard?.writeText(t);alert("結果をコピーしました。")}
render();
</script>
</body>
</html>
