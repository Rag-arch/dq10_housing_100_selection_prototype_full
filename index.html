<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DQX 専門家・ガチ勢向けマスター診断（マニアック版）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f5ef;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-sub: #7a7a7a;
            --border-main: #2b2b2b;
            --bruna-red: #d93829;
            --bruna-blue: #266093;
            --bruna-yellow: #f2b93b;
            --bruna-green: #438b43;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            letter-spacing: 0.05em;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-main);
            border-radius: 12px;
            padding: 24px 20px;
            box-shadow: 4px 4px 0px var(--border-main);
            margin-bottom: 20px;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        .hero-title {
            font-size: 1.35rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .hero-subtitle {
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 18px;
        }

        .mode-select-label {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-mode {
            background: #fff;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 2px 2px 0px var(--border-main);
        }

        .btn-mode:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 0px var(--border-main);
            background: #fdfbf7;
        }

        .btn-mode b {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .btn-mode small {
            color: var(--text-sub);
            font-size: 0.73rem;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .progress-container {
            height: 8px;
            background: #e0e0e0;
            border: 2px solid var(--border-main);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar {
            height: 100%;
            background: var(--bruna-red);
            width: 0%;
            transition: width 0.3s ease;
        }

        .q-title {
            font-size: 0.98rem;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: left;
            line-height: 1.5;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .choice-btn {
            background: #fff;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px 14px;
            text-align: left;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.1s ease;
            box-shadow: 2px 2px 0px var(--border-main);
        }

        .choice-btn:hover {
            background: #fdfbf7;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #fff;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .result-label {
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            color: var(--bruna-red);
            font-weight: bold;
            text-align: center;
        }

        .result-percent {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin: 8px 0;
            color: var(--text-main);
        }

        .result-percent span {
            font-size: 1.3rem;
        }

        .result-rank {
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            background: #f4efe6;
            border: 2px solid var(--border-main);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .score-box {
            margin-bottom: 16px;
        }

        .score-row {
            display: grid;
            grid-template-columns: 90px 1fr 40px;
            gap: 8px;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .score-track {
            height: 7px;
            background: #eee;
            border: 1px solid var(--border-main);
            border-radius: 99px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: var(--bruna-blue);
        }

        .insight-box {
            background: #fffdf5;
            border: 2px dashed var(--bruna-yellow);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 0.82rem;
        }

        .insight-box h4 {
            color: #b58106;
            margin-bottom: 6px;
            font-size: 0.88rem;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background: var(--bruna-red);
            color: #fff;
            border: 2px solid var(--border-main);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-main);
            transition: transform 0.1s;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .footer-note {
            font-size: 0.7rem;
            color: var(--text-sub);
            text-align: center;
            margin-top: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
        <div class="card">
            <h1 class="hero-title">🐰 DQX ガチ勢マスター診断</h1>
            <p class="hero-subtitle">妥協なしの専門テクニック・審査基準を徹底検証<br>（全ジャンル10問・完全ランダムシャッフル版）</p>
            
            <div class="mode-select-label">▼ 挑戦したい専門ジャンルを選んでね</div>
            <div class="mode-buttons">
                <button class="btn-mode" onclick="startQuiz('hiroba')">
                    <b>📸 広場・写真コンテスト（演出・サムネ解像度編）</b>
                    <small>縮小クリップ対策・ライティング・ストーリー性</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('micolle')">
                    <b>👗 マイコレ・ドレア（種族干渉・配色黄金比編）</b>
                    <small>骨格補正・テクスチャ・ツヤめきペレット配分</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('housing')">
                    <b>🏠 ハウコン（座標ずらし・カメラ抜け制御編）</b>
                    <small>当たり判定・クリップ回避・立体イリュージョン</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('ascon')">
                    <b>👑 アスコン（微小フレーム・陰影制御編）</b>
                    <small>しぐさキャンセル・環境光・オリジナリティ</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('fishing')">
                    <b>🎣 フィッシング（暴れモーション・テンション管理編）</b>
                    <small>くいつき度消費予測・魚影選別・周回最適化</small>
                </button>
                <button class="btn-mode" onclick="startQuiz('minigame')">
                    <b>⭐ トラシュカ（ベクトル予測・判定ボックス編）</b>
                    <small>着水ラグ・浮き輪特性・被弾回避ルート</small>
                </button>
            </div>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
        <div class="card">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="quiz-header">
                <span id="q-num">Q1 / 10</span>
                <span id="q-cat" style="color: var(--bruna-blue);">カテゴリ</span>
            </div>
            <h2 id="q-title" class="q-title">質問文がここに入ります</h2>
            <div id="choices-area" class="choices"></div>
            <button class="btn-secondary" onclick="prevQuestion()" id="btn-prev">最初に戻る</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div class="card" id="result-card">
            <div class="result-label" id="res-mode-label">DIAGNOSIS RESULT</div>
            <div class="result-percent" id="res-percent">82<span>%</span></div>
            <div class="result-rank" id="res-rank">S ｜ 熟練のガチ勢・トップランカーレベル！</div>

            <div class="score-box" id="score-breakdown"></div>

            <div class="insight-box">
                <h4>💡 プロの赤ペン先生＆マニアック解説</h4>
                <p id="res-advice">ここにアドバイスが入ります。</p>
            </div>
        </div>

        <div class="action-group">
            <button class="btn-primary" onclick="downloadResultImage()">📷 結果を画像で保存・シェアする</button>
            <button class="btn-secondary" onclick="restart()">ジャンル選定に戻る</button>
        </div>
        <div class="footer-note">※DQXの仕様やコンテストの傾向を極限まで深掘りした学習用シミュレーターです。</div>
    </div>

</div>

<script>
// ==========================================
// ガチ勢向け専門データ（各10問）
// ==========================================
const QUESTION_DATA = {
    hiroba: {
        name: "広場・写真コンテスト（演出・サムネ解像度編）",
        questions: [
            { cat: "サムネ圧縮", text: "「みんなのお知らせ広場」の一覧（極小サムネイル状態）で、審査員や他人のスクロールの手を止めさせるために最も不可欠な要素は？", choices: [
                ["キャラクターが着ている最新装備のブランドアピール", 1],
                ["主役の輪郭が周囲の背景に溶け込まない『明度差・コントラストの確保』", 3],
                ["写真全体にエフェクトを盛って華やかにすること", 0]
            ]},
            { cat: "視線誘導", text: "被写界深度（ピント）と視線誘導のテクニックとして、画面の「3分割法」や交点に配置する際の注意点は？", choices: [
                ["画面の中央にキャラクターをドンと置くのが一番安定する", 1],
                ["画面いっぱいに情報を敷き詰めて密度を上げる", 0],
                ["視線の先（キャラクターが向いている方向）に十分な『余白』をあけ、窮屈さを消す", 3]
            ]},
            { cat: "エフェクト", text: "カメラ機能の「エフェクト（集中線やキラキラなど）」を使う際、プロが避けるべき致命的な罠は？", choices: [
                ["エフェクトの主張が強すぎて、肝心のキャラクターの表情や輪郭がつぶれること", 3],
                ["カラーフィルターと同時に使えないこと", 0],
                ["エフェクトを全く使わずに地味な絵面になってしまうこと", 1]
            ]},
            { cat: "タイトル", text: "写真のタイトル・一言コメントで、上位入賞常連者がよく使う心理的テクニックは？", choices: [
                ["「上手に撮れました！」など個人的な感想をダイレクトに書く", 0],
                ["写真単体ではあえて語らず、タイトルで『一筋のストーリーや余白』を補完する", 3],
                ["撮影した場所の名前や、使用したスタジオのタグを正確に記載する", 1]
            ]},
            { cat: "環境光", text: "屋外フィールドで撮影する際、キャラクターの顔に不自然な影（死角の黒ずみ）を作らないための技術は？", choices: [
                ["太陽の高度や方位（朝・昼・夕方）を計算し、カメラアングルと光源の角度を一致させる", 3],
                ["とりあえず「おきあがる」等のしぐさで強制的に光源をリセットする", 1],
                ["夜間にしてランタンや照明家具の光だけに頼る", 0]
            ]},
            { cat: "背景分離", text: "背景がごちゃついた場所で主役を際立たせるため、DQXのカメラ仕様において有効な手段は？", choices: [
                ["キャラクターの服の色を背景と同系色にして馴染ませる", 0],
                ["スタンプやフレームで周囲を完全に隠す", 1],
                ["カメラ距離を限界まで引き、ズーム（焦点距離）を調整して背景をボケさせる（※仕様の限界を利用）", 3]
            ]},
            { cat: "構図意図", text: "「あえて画面の端に小さくキャラクターを配置する（日の丸構図の崩し）」が評価される理由は？", choices: [
                ["キャラクターの顔のアップよりも体全体が見えるから", 1],
                ["広大な世界観や孤独感、ドラマチックな『空気感』を演出できるから", 3],
                ["単に中心を外すことで素人っぽさを演出できるから", 0]
            ]},
            { cat: "動機同期", text: "グループ・フレンド写真を撮影する際、複数人の「目線やモーションの同期」で最も気をつけるべき点は？", choices: [
                ["自動ループするしぐさの「コマズレ」を許さず、完全に秒単位のタイミングを合わせる", 3],
                ["全員がカメラ目線で笑顔をキメていること", 1],
                ["全員が同じ服を着てペアルック感を出すこと", 0]
            ]},
            { cat: "トレンド", text: "広場のコンテストで「過去に入賞した作品の類似表現」が選ばれにくくなる原因は？", choices: [
                ["運営のシステムが自動で類似画像を弾くようになっているから", 0],
                ["トレンドに合わせた方がむしろ入賞率は上がるから", 1],
                ["審査員や投票者に『既視感（マンネリ）』を与えてしまい、新規性・独創性が評価されないから", 3]
            ]},
            { cat: "最終確認", text: "投稿ボタンを押す直前、プロの写真家やガチ勢が必ず行う最終チェックとは？", choices: [
                ["フレンドチャットに画像を貼り付けて「いいね」と言われるか試す", 1],
                ["スマホやPCの縮小ウインドウに縮めて、スマホ勢の視認性テストを行う", 3],
                ["特に見直さず、直感の勢いままに即座に投稿する", 0]
            ]}
        ]
    },
    micolle: {
        name: "マイコレ・ドレア（種族干渉・配色黄金比編）",
        questions: [
            { cat: "配色比率", text: "ドレアのカラーリングにおける「メイン2色：サブ1色：アクセント」の視覚的黄金比率は？", choices: [
                ["すべての部位を均等に4色ずつ塗り分ける", 0],
                ["主役（70%）：ベース（25%）：アクセント（5%）のトーンバランスを守る", 3],
                ["好きな色を重ねられるだけ塗り重ねる", 0]
            ]},
            { cat: "種族干渉", text: "オーガ男やプクリポなど、特殊な骨格を持つ種族でドレアを組む際、最も警戒すべき「テクスチャの破綻」とは？", choices: [
                ["特定の体型によって装備の合わせ目（ウェストや肩甲骨）が引き伸ばされ、模様が歪む現象", 3],
                ["カラーリングパレットの色が種族によって勝手に変化してしまう現象", 1],
                ["武器を構えたときに装備のグラフィックが消えてしまう現象", 0]
            ]},
            { cat: "素材質感", text: "「ツヤめきペレット」や「超便利ツール織物」を使った素材感のコントラストで、ダサく見えてしまう悪手は？", choices: [
                ["ツヤを一切使わずにマットなまま仕上げること", 0],
                ["布と金属の質感を完全に同じ色で統一してしまうこと", 1],
                ["すべてのパーツに同じ強さのツヤを入れ、全体がテカテカのプラスチック感になること", 3]
            ]},
            { cat: "シルエット", text: "「Aライン」「Iライン」「Yライン」などのシルエット理論をドレアに応用する際の効果は？", choices: [
                ["キャラクターの頭身や足の長さを視覚的に補正し、スタイリッシュに見せる", 3],
                ["どの装備を着ても同じ見た目になるように固定する", 1],
                ["キャラクターの当たり判定を小さくして戦闘を有利にする", 0]
            ]},
            { cat: "パーツ流用", text: "上下セット装備を使わず、あえて別々のセットのパーツを組み合わせて違和感を消すための技術は？", choices: [
                ["同じ職人の装備であれば、どれを組み合わせても自然に馴染む", 1],
                ["繋ぎ目（ベルトや腰布など）のデザインを別の装飾で自然に隠すか、色を完全同色にする", 3],
                ["色の系統さえ合っていれば繋ぎ目は気にしなくてよい", 0]
            ]},
            { cat: "武器盾調和", text: "戦闘時に表示される「武器や盾」をドレアの一部として完全に組み込む際のデザインアプローチは？", choices: [
                ["武器や盾は非表示設定にするのが一番無難である", 1],
                ["常に一番攻撃力が高い最新の武器を装備させておく", 0],
                ["抜刀時のポーズで武器のカラーが全体のアクセントカラーとバッティングしないようにする", 3]

            { cat: "色相環", text: "色選びに迷った際、色相環における「補色（反対色）」をアクセントとして使うときの鉄則は？", choices: [

            { cat: "足元処理", text: "「靴（足装備）」と「足下露出（素足やタイツ等）」の境界線で、プロが必ずこだわる微調整とは？", choices: [
                ["足首のくびれ部分の色と、靴の履き口のテクスチャの重なりを緻密に計算する", 3],

                ["靴の色はメインカラーと完全に同じ色にしておく", 0]
            ]},
            { cat: "引き算美", text: "装飾（羽・マント・過剰な装飾品）を盛り込みすぎたドレアから、洗練された「引き算」を行う基準は？", choices: [
                ["シンプルすぎる地味な見た目になったら、さらに課金装備を足す", 0],
                ["自分が気に入っているパーツならどれだけ多くても残す", 0],
                ["全体の焦点がどこにあるか分からなくなっている場合、一番主張の強い装飾を1つ外す", 3]
            ]},
            { cat: "コンセプト", text: "「架空の職種・部族・ストーリー」といった緻密な設定をドレアの設計図に組み込む最大のメリットは？", choices: [
                ["他の人と絶対に被らない奇抜な見た目を作ることができる", 0],
                ["コンテストの応募アンケートで文字数をたくさん埋めることができる", 0],
                ["色選びやパーツ選定に一貫性が生まれ、見る人に強烈な説得力と世界観を伝えることができる", 3]

        ]
    },
    housing: {
        name: "ハウコン（座標ずらし・カメラ抜け制御編）",
        questions: [

                ["アイテムが床でバウンドしている間は絶対に触れてはいけない", 0]
            ]},
            { cat: "メンタル管理", text: "一度海に落とされて（1デス）リスポーンした直後、焦ってミスを連発して全ロスする悪循環を防ぐためのメンタル制御は？", choices: [
                ["「もうダメだ」と投げやりになって、ヤケクソで危険な場所に飛び込む", 0],
                ["デスによるペナルティと残りのスコアを冷静に計算し、安全重視の堅実な立ち回りに即座に切り替える", 3],
                ["運が悪かったと諦めてコントローラーを置く", 0]
            ]},
            { cat: "海の王者", text: "トラシュカのランキングで常に上位・満点付近を叩き出す「海の王者」たちの共通の身体的・精神的特徴とは？", choices: [
                ["運が異常に良くて、毎回自分の周りに金箱ばかりが落ちてくる", 0],
                ["動体視力と空間把握能力が極めて高く、画面内のすべての動きを完全に予測・制御できている", 3],
                ["寝る間も惜しんで何千回も何万回もひたすら数撃ち当たれで周回している", 0]
            ]}
        ]
    }
};

// ==========================================
// 状態管理・エンジン
// ==========================================
let currentMode = 'housing';
let currentIndex = 0;
let userAnswers = [];

function startQuiz(mode) {
    currentMode = mode;
    currentIndex = 0;
    userAnswers = [];
    renderQuestion();
    showScreen('screen-quiz');
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
    const qList = QUESTION_DATA[currentMode].questions;
    const q = qList[currentIndex];

    const progressPercent = (currentIndex / qList.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;

    document.getElementById('q-num').textContent = `Q${currentIndex + 1} / ${qList.length}`;
    document.getElementById('q-cat').textContent = q.cat;
    document.getElementById('q-title').textContent = q.text;

    const choicesArea = document.getElementById('choices-area');
    choicesArea.innerHTML = '';

    q.choices.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        const keyLetters = ['A', 'B', 'C'];
        btn.innerHTML = `<b>${keyLetters[idx]}：${choice[0]}</b>`;
        btn.onclick = () => selectAnswer(choice[1]);
        choicesArea.appendChild(btn);
    });

    const prevBtn = document.getElementById('btn-prev');
    if (currentIndex === 0) {
        prevBtn.textContent = "ジャンル選定に戻る";
        prevBtn.onclick = () => showScreen('screen-start');
    } else {
        prevBtn.textContent = "一つ戻る";
        prevBtn.onclick = () => prevQuestion();
    }
}

function selectAnswer(score) {
    userAnswers[currentIndex] = score;
    const qList = QUESTION_DATA[currentMode].questions;
    
    if (currentIndex < qList.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        calculateResult();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function calculateResult() {
    const totalScore = userAnswers.reduce((a, b) => a + b, 0);
    const maxScore = QUESTION_DATA[currentMode].questions.length * 3;
    
    let percentage = Math.round((totalScore / maxScore) * 75 + 20);
    percentage = Math.min(98, Math.max(15, percentage));

    const modeName = QUESTION_DATA[currentMode].name;
    document.getElementById('res-mode-label').textContent = modeName.toUpperCase();

    let rankText = "";
    if (percentage >= 88) rankText = `S ｜ 熟練のガチ勢・トップランカー極みレベル！`;
    else if (percentage >= 72) rankText = `A ｜ コンテスト上位・高得点を確実に狙える実力者！`;
    else if (percentage >= 50) rankText = `B ｜ 知識の引き出しは豊富！細部の詰めが勝利の鍵`;
    else rankText = `C ｜ 伸びしろの塊！マニアックな専門視点を吸収して大躍進しよう`;

    document.getElementById('res-percent').innerHTML = `${percentage}<span>%</span>`;
    document.getElementById('res-rank').textContent = rankText;

    const breakdownArea = document.getElementById('score-breakdown');
    breakdownArea.innerHTML = `
        <div class="score-row"><span>専門知識</span><div class="score-track"><div class="score-fill" style="width: ${Math.min(100, percentage + 5)}%;"></div></div><span>${Math.min(100, percentage + 5)}%</span></div>
        <div class="score-row"><span>実戦テク</span><div class="score-track"><div class="score-fill" style="width: ${percentage}%;"></div></div><span>${percentage}%</span></div>
        <div class="score-row"><span>判断・分析力</span><div class="score-track"><div class="score-fill" style="width: ${Math.max(35, percentage - 10)}%;"></div></div><span>${Math.max(35, percentage - 10)}%</span></div>
    `;

    // ランクに応じた専用コメント（分岐の完全独立化）
    let adviceText = "";
    if (percentage >= 88) {
        adviceText = `【Sランク・赤ペン先生】お見事です！正解の位置がランダムに散らばる中、一切惑わされずにこのスコアを叩き出すのは本物のトップランカー証拠。仕様の裏側やフレーム単位の調整まで完璧に体に染み込んでいますね。ぜひその知識を周りにも広げてください！`;
    } else if (percentage >= 72) {
        adviceText = `【Aランク・赤ペン先生】素晴らしい正答率です！コンテストの審査基準や実戦的なテクニックの要所をしっかりと抑えています。あと一歩で満点圏内なので、惜しかった問題の「仕様の意図」を振り返ってみるとさらに視野が広がりますよ！`;
    } else if (percentage >= 50) {
        adviceText = `【Bランク・赤ペン先生】なかなかの健闘です！基本的な知識やトレンドへのアンテナは張られています。ただ、細部の当たり判定やカメラのクリップ回避、フレーム単位の調整といった「一歩上のマニアックな視点」を取り入れると、さらに上のランクへいけます！`;
    } else {
        adviceText = `【Cランク・赤ペン先生】お疲れ様でした！今回は位置のランダム性もあり、かなり歯ごたえのある内容だったはずです。ここで出てきた専門用語やテクニックはどれもガチ勢の常識的な引き出しなので、今回の解説をヒントにぜひリベンジしてみてください！`;
    }
    
    document.getElementById('res-advice').textContent = adviceText;

    showScreen('screen-result');
}

function restart() {
    currentIndex = 0;
    userAnswers = [];
    showScreen('screen-start');
}

function downloadResultImage() {
    const targetCard = document.getElementById('result-card');
    
    html2canvas(targetCard, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'dqx-maniax-diagnosis-result.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>
