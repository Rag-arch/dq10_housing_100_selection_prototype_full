<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>この１枚、伝わってる？ - 創作・作品アドバイザー（完全版）</title>
    <style>
        :root {
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --border-color: #e6dfd1;
            --text-main: #3b271a;
            --text-sub: #7a6552;
            --primary: #f06226;
            --primary-hover: #d9531b;
            --accent-yellow: #e6a127;
            --accent-blue: #2d68c4;
            --tag-bg: #fff4ec;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 30px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 6px 0;
            letter-spacing: 0.03em;
        }

        .header p {
            font-size: 12.5px;
            color: var(--text-sub);
            margin: 0;
            line-height: 1.5;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(59, 39, 26, 0.04);
        }

        .card h3 {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .mode-btn {
            background: #faf7f0;
            border: 2px solid var(--border-color);
            padding: 10px 4px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .mode-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .mode-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 3px 10px rgba(240, 98, 38, 0.3);
        }

        label {
            display: block;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background: #faf7f0;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 13.5px;
            transition: all 0.2s ease;
            margin-bottom: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(240, 98, 38, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .action-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 14.5px;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(240, 98, 38, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(240, 98, 38, 0.4);
        }

        .result-box {
            white-space: pre-wrap;
            background: #faf7f0;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11.5px;
            color: var(--text-main);
            line-height: 1.5;
            max-height: 220px;
            overflow-y: auto;
        }

        .copy-hint {
            font-size: 11.5px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📷 この１枚、伝わってる？</h1>
            <p>作品情報を入力してプロンプトを生成。無料AIに写真と一緒に入力すると、スマホや印刷で1枚にすっきり収まるおしゃれな診断レポートを出力させられます。</p>
        </div>

        <div class="card">
            <h3>🎯 1. 部門・スタイルを選択</h3>
            <div class="mode-selector">
                <button type="button" class="mode-btn" id="btn-drea-men" onclick="setMode('drea-men')">👔 ドレア<br><span style="font-size:9.5px; font-weight:normal;">(Men)</span></button>
                <button type="button" class="mode-btn active" id="btn-drea-women" onclick="setMode('drea-women')">👗 ドレア<br><span style="font-size:9.5px; font-weight:normal;">(Women)</span></button>
                <button type="button" class="mode-btn" id="btn-housing" onclick="setMode('housing')">🏠 ハウジング</button>
            </div>

            <h3 id="form-title-label">🌷 作品情報の入力</h3>
            
            <label id="label-title">作品名 / テーマ名</label>
            <input type="text" id="title" placeholder="例: 星空の魔法使い">

            <label id="label-intent">込められたこだわり・ストーリー（INTENT）</label>
            <textarea id="intent" rows="3" placeholder="例: 夜空をイメージした深い青と、ゴールドの装飾の調和"></textarea>
        </div>

        <button class="action-btn" onclick="generatePrompt()">
            <span>AI用プロンプトを生成してコピーする ✏️</span>
        </button>

        <div class="card" id="resultCard" style="display:none; margin-top: 16px;">
            <h3>🧺 生成されたプロンプト</h3>
            <p class="copy-hint">✨ コピー完了！診断させたいSS（スクリーンショット）と一緒に、AIのチャット画面にそのまま貼り付けて送信してください。</p>
            <div class="result-box" id="resultOutput"></div>
        </div>
    </div>

<script>
let currentMode = 'drea-women';

function setMode(mode) {
    currentMode = mode;
    const btnDreaMen = document.getElementById('btn-drea-men');
    const btnDreaWomen = document.getElementById('btn-drea-women');
    const btnHousing = document.getElementById('btn-housing');
    const formTitleLabel = document.getElementById('form-title-label');
    const labelTitle = document.getElementById('label-title');
    const labelIntent = document.getElementById('label-intent');
    const titleInput = document.getElementById('title');
    const intentInput = document.getElementById('intent');

    btnDreaMen.classList.remove('active');
    btnDreaWomen.classList.remove('active');
    btnHousing.classList.remove('active');

    if (mode === 'drea-men') {
        btnDreaMen.classList.add('active');
        formTitleLabel.innerText = '🎀 ドレア (Men) 作品情報の入力';
        labelTitle.innerText = 'ドレア名 / テーマ';
        titleInput.placeholder = '例: 孤高の旅人';
        labelIntent.innerText = 'スタイリングのこだわり・ストーリー（INTENT）';
        intentInput.placeholder = '例: 重厚な鎧とマントの質感、男性らしいシルエットの追求';
    } else if (mode === 'drea-women') {
        btnDreaWomen.classList.add('active');
        formTitleLabel.innerText = '🎀 ドレア (Women) 作品情報の入力';
        labelTitle.innerText = 'ドレア名 / テーマ';
        titleInput.placeholder = '例: 星空の魔法使い';
        labelIntent.innerText = 'スタイリングのこだわり・ストーリー（INTENT）';
        intentInput.placeholder = '例: 夜空をイメージした深い青と、ゴールドの装飾の調和';
    } else {
        btnHousing.classList.add('active');
        formTitleLabel.innerText = '🌷 ハウジング作品情報の入力';
        labelTitle.innerText = '作品タイトル';
        titleInput.placeholder = '例: 地中美術館';
        labelIntent.innerText = '伝えたいコンセプト・意図（INTENT）';
        intentInput.placeholder = '例: ホワイトキューブ空間に展示された巨大な絵画';
    }
}

function generatePrompt() {
    const title = document.getElementById('title').value.trim();
    const intent = document.getElementById('intent').value.trim();
    const resultCard = document.getElementById('resultCard');
    const resultOutput = document.getElementById('resultOutput');

    if (!title || !intent) { 
        alert('タイトルとこだわりを入力してください'); 
        return; 
    }

    resultCard.style.display = 'block';
    resultCard.scrollIntoView({ behavior: 'smooth' });

    let prompt = '';

    if (currentMode === 'housing') {
        prompt = `あなたはプロの空間デザイン・写真作品の厳格な講評者であり、北欧絵本の世界観を取り入れた優れたUI/UXデザイナーです。
添付された空間デザインの写真を分析し、優れた空間写真に共通する評価軸（「主題がひと目で伝わる構図と視線誘導」「光と影による空気感・ライティング演出」「情報量のコントロールと抜け感」「タイトルとのシナジー・物語の気配」）を基準にして厳しく診断を行ってください。

【作品情報】
・タイトル: ${title}
・作者が伝えたい意図（INTENT）: ${intent}

【出力フォーマットおよび記述の厳守ルール】
1. **テキスト出力による完結**: 画像ファイル（HTML/PDFレンダリング等）の自動生成やコード出力は行えず、すべてスマホの画面1枚（スクロール最小限）ですっきりと読める、美しく整形されたテキスト（Markdown）で診断レポートを出力してください。
2. **最上部のビジュアル表現**: レポートの冒頭に、添付された作品のスクリーンショット（またはイメージ）が存在することを想定した見出し「【対象作品ビジュアル】${title}」を配置してください。
3. **カラー・トーンの演出**: 北欧絵本（ミッフィー風）の温かみのある世界観をイメージさせ、要所に適切な絵文字やシンプルな見出しを用いて視覚的に洗練されたレイアウトにしてください。

以下の4つの項目を、漏れなく詳細かつ具体的に盛り込んでください：
1. 【伝達力スコア】（100点満点中の点数と一言評価の要約）
2. 【写真から実際に伝わった要素】（構図、ライティング、空間密度、世界観の一貫性を5段階評価で表現）
3. 【GAPの分析】（意図と受け取り方のズレ、改善の余地を「GAP1」「GAP2」などで簡潔に掘り下げる）
4. 【写真のクオリティをさらに高めるための改善アドバイス】（パースの活かし方、光のコントラスト調整、細部の演出などプロのテクニックを箇条書きで）`;
    } else {
        const genderLabel = currentMode === 'drea-men' ? '男性モデルのスタイリング' : '女性モデルのスタイリング';
        prompt = `あなたはプロのファッション・写真作品の厳格な講評者であり、北欧絵本の世界観を取り入れた優れたUI/UXデザイナーです。
添付された${genderLabel}の写真作品を分析し、優れたポートレート写真に共通する評価軸（「一言で物語が脳内再生されるストーリー性とタイトルのシンクロ度」「モデルの個性を活かしたシルエットとポージングの妙」「光・エフェクト・撮影環境による美術力」「独自の世界観の演出」）を基準にして厳格に診断を行ってください。

【作品情報】
・ドレア名 / テーマ: ${title}
・スタイリングのこだわり（INTENT）: ${intent}

【出力フォーマットおよび記述の厳守ルール】
1. **テキスト出力による完結**: 画像ファイル（HTML/PDFレンダリング等）の自動生成やコード出力は行えず、すべてスマホの画面1枚（スクロール最小限）ですっきりと読める、美しく整形されたテキスト（Markdown）で診断レポートを出力してください。
2. **最上部のビジュアル表現**: レポートの冒頭に、添付された作品のスクリーンショットが存在することを想定した見出し「【対象作品ビジュアル】${title}」を配置してください。
3. **カラー・トーンの演出**: 北欧絵本（ミッフィー風）の温かみのある世界観をイメージさせ、要所に適切な絵文字やシンプルな見出しを用いて視覚的に洗練されたレイアウトにしてください。

以下の4つの項目を、漏れなく詳細かつ具体的に盛り込んでください：
1. 【訴求力スコア】（100点満点中の点数と一言評価の要約）
2. 【写真から実際に伝わった要素】（ストーリー性、被写体の活かし方、カラーバランス、世界観の演出を5段階評価で表現）
3. 【GAPの分析】（意図と受け取り方のズレ、惜しいポイントを「GAP1」「GAP2`などで簡潔に掘り下げる）
4. 【写真をより魅力的に仕上げるための改善アドバイス】（撮影アングル、しぐさの瞬間、背景の活用、タイトルのブラッシュアップ案などを具体的に箇条書きで）`;
    }

    resultOutput.innerText = prompt;

    navigator.clipboard.writeText(prompt).then(() => {
        const btn = document.querySelector('.action-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span>Copied! コピー完了しました 🎈</span>';
        btn.style.background = '#2d68c4';
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.background = '';
        }, 2000);
    }).catch(err => {
        console.error('コピーに失敗しました', err);
    });
}
</script>

</body>
</html>
